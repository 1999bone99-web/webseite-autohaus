# Holt jeden Morgen den Fahrzeugbestand von www.bmw-jw-marhoffer.de und committet ihn.
# Vercel baut danach automatisch neu. Manuell starten: Actions → Bestand abgleichen → Run workflow.
name: Bestand abgleichen

on:
  schedule:
    - cron: "17 4 * * *" # täglich 04:17 UTC, also 05:17 bzw. 06:17 Uhr deutscher Zeit
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bestand
  cancel-in-progress: false

jobs:
  abgleich:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bestand laden
        run: bash scripts/bestand/fetch.sh

      - name: Änderungen committen
        run: |
          if git diff --quiet -- src/data; then
            echo "Keine Änderungen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data
          git commit -m "Bestand abgleichen ($(date +%d.%m.%Y))"
          git push
